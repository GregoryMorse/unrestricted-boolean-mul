name = "unrestricted_boolean_mul"
version = "0.1.0"
defaultTargets = ["UnrestrictedBooleanMul"]
moreLeanArgs = ["-j1", "-M4096"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

[[lean_lib]]
name = "UnrestrictedBooleanMul"
globs = ["UnrestrictedBooleanMul"]

# Separate statement/proof environments for Palomar's Comparator.
# Neither is implicitly added to the default n4 library target.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
