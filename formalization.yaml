# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: v0.4
project:
  name: Unrestricted Boolean multiplicative complexity of four-term polynomial multiplication
  description: >-
    Formalizes the exact minimum AND-gate counts 0, 1, 3, 6 and 9 for
    binary polynomial multiplication with zero through four coefficients per
    operand. XOR and constants are free, and AND inputs may reuse arbitrary
    earlier nonlinear wires. The principal result excludes eight-gate
    four-term circuits and matches an explicit nine-gate construction.
    Separate research workflows check selected n5 quadratic results and
    n6 upper bounds and reductions; their open unrestricted/bilinear lower
    bounds are not claims of this submission.
  authors: [Gregory Morse]
  responsible_maintainers: [Gregory Morse]
  license: MIT
classification:
  arxiv: [cs.CC, cs.DS]
  msc2020: []
sources:
  - title: >-
      Unrestricted Boolean Multiplicative Complexity of Four-Term Binary
      Polynomial Multiplication: Rational Places, Hasse Jets, and the
      Failure of Nonlinear Feedback
    authors: [Gregory Morse]
    id: arXiv:2608.30238v1
    location: https://arxiv.org/html/2608.30238v1
    type: paper
    relationship: formalizes
    note: >-
      Definition 2.1, Propositions 2.3 and 2.4, and Theorem 9.1. The n3
      lower bound is proved internally rather than assuming the cited coding
      bound. The general Boyar--Find question and Section 10's n5 conjecture
      are not claimed. This submission claims source fidelity, not new novelty.
    license: CC-BY-4.0
    author_endorsement: participated
related_formalizations:
  - id: https://github.com/GregoryMorse/unrestricted-boolean-mul/tree/2ebc0cf42039e4b5de84cb7f9d97cad4791c669d
    relationship: builds-on
    note: >-
      The same author's n4-arxiv-v2 development on Lean 4.32.1. This update
      migrates to 4.33.1 and isolates the existing theorems for Comparator
      and dedicated CI; it is not an independent formalization.
status:
  scope: >-
    Comparator selects six original declarations: the five exact complexities
    for n=0 through 4 and the n4 eight-gate impossibility. The Boolean ANF
    circuit model includes constants, arbitrary linear recombination and
    nonlinear reuse. Natural subtraction gives no outputs when n=0.
    The minimum's fallback zero is unused because these targets have circuits.
    The six deliberate Challenge theorem holes are not imported by Solution.
    Selected n5/n6 work elsewhere is excluded from the default proof closure
    and this Comparator selection. No unrestricted n5 or exact bilinear n6
    lower bound is asserted.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
automation:
  methods:
    - method: agent
      models:
        - OpenAI GPT-5.6 Sol (original development, as disclosed in the paper)
        - Anthropic Opus 5 (critical referee, as disclosed in the paper)
        - Codex (release preparation; exact current model not recorded)
      framework: Codex and Lean 4
      tool_setup: >-
        AI-assisted proof development and repair, ordinary Lean tactics and
        kernel checking, plus Python/C++ regression experiments. No native
        decision bridge or custom axiom is a premise of the selected results.
      cost:
        wall_time: not tracked
        spend_usd: not tracked
        hardware: not reconstructed; current release checks use hosted Linux CI
      prompting_notes: Human-directed development with explicit proof-boundary audits.
  notes: >-
    Gregory Morse directed and reviewed the research and assumes responsibility.
    The source paper reports the original model roles. Release automation
    separates CI, checks the statement interface, and records verification
    evidence; it does not supply independent human peer review.
fidelity:
  divergences: >-
    No statement divergence is intended for the six selected results after
    source-level comparison with the cited sections. The n3 proof method
    differs as noted above. The paper pins n4-arxiv-v2 on Lean 4.32.1; this
    release uses Lean 4.33.1 without claiming to update that published snapshot.
    The remaining source-alignment and official verification gates are
    reported in n4/PALOMAR_AUDIT.md, not inferred from compilation alone.
review:
  status: self-assessed
  notes: >-
    Author responsibility confirmed during preparation. The paper discloses
    an AI referee. VibeMathed reports an independent build, axiom audit and
    leanchecker replay of n4-arxiv-v2 on 2026-09-03, while explicitly not
    claiming independent statement anchoring. That historical replay is not
    evidence for this new commit. No Palomar editorial review or registration
    is claimed.
alignment:
