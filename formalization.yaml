      module: UnrestrictedBooleanMul.SmallCases
      status: proved
    - source: arXiv:2608.30238v1 Proposition 2.3
      lean: UnrestrictedBooleanMul.mc_mul_two
      module: UnrestrictedBooleanMul.SmallCases
      status: proved
    - source: arXiv:2608.30238v1 Proposition 2.4
