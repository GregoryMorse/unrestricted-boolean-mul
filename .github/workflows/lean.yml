name: Published n4 Lean verification

on:
  push:
    branches: [main]
    tags: ['n4-*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: n4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Check complete n4 source manifest and CI isolation controls
        run: |
          python3 scripts/check_lean_sources.py
          python3 scripts/check_n4_manifest.py
          python3 -m unittest discover -s scripts -p test_ci_verify.py -v
      - name: Install the exact checksum-verified official Lean release
        run: bash scripts/install_ci_lean.sh
      - name: Fetch the pinned official comparator sandbox installer
        uses: actions/checkout@v4
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
          path: _palomar_tools
          persist-credentials: false
      - name: Install the pinned comparator sandbox without disabling confinement
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq meson ninja-build libcap-dev pkg-config >/dev/null
          echo "COMPARATOR_BWRAP=$(bash _palomar_tools/scripts/install_bwrap.sh "$RUNNER_TEMP/n4-bwrap")" >> "$GITHUB_ENV"
      - name: Restore pinned Mathlib cache
        run: lake exe cache get
      - name: Verify the selected proof closure, serially
        run: python3 scripts/ci_verify.py --profile n4 --build --replay
      - name: Preserve source hashes, command logs and enforced axiom audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n4-verification-${{ github.sha }}
          path: .lake/ci/n4.json
          if-no-files-found: error
