name: Published n4 Lean verification

on:
  push:
    branches: [main]
    tags: ['n4-*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: n4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Check complete n4 source manifest and CI isolation controls
        run: |
          python3 scripts/check_n4_manifest.py
          python3 -m unittest discover -s scripts -p test_ci_verify.py -v
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          leanchecker: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Restore pinned Mathlib cache
        run: lake exe cache get
      - name: Verify the selected proof closure, serially
        run: python3 scripts/ci_verify.py --profile n4 --build --replay
      - name: Preserve source hashes, command logs and enforced axiom audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n4-verification-${{ github.sha }}
          path: .lake/ci/n4.json
          if-no-files-found: error
