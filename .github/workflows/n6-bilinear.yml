name: n6 bilinear reductions and artifact checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'UnrestrictedBooleanMul/**'
      - 'n6/**'
      - 'lake*'
      - 'lean-toolchain'
      - 'scripts/ci_verify.py'
      - '.github/workflows/n6-bilinear.yml'

permissions:
  contents: read

concurrency:
  group: n6-bilinear-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install the exact checksum-verified official Lean release
        run: bash scripts/install_ci_lean.sh
      - name: Restore pinned Mathlib cache
        run: lake exe cache get
      - name: Verify the selected proof closure, serially
        run: python3 scripts/ci_verify.py --profile n6-bilinear --build
      - name: Preserve source hashes, command logs and enforced axiom audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n6-bilinear-verification-${{ github.sha }}
          path: .lake/ci/n6-bilinear.json
          if-no-files-found: error
      - name: Check archived artifacts without exhaustive replay
        run: python3 n6/quick.py
      - name: Check malformed-input rejection and witness transcription
        run: |
          python3 -B -m unittest discover -s n6 -p test_integration.py -v
          python3 -B -m unittest discover -s n6 -p test_lean_witness_source.py -v
