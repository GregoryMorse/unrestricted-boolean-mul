name: n5 quadratic geometry (unrestricted lower bound open)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'UnrestrictedBooleanMul/**'
      - 'n5/Paper2Audit.lean'
      - 'lake*'
      - 'lean-toolchain'
      - 'scripts/ci_verify.py'
      - '.github/workflows/n5.yml'

permissions:
  contents: read

concurrency:
  group: n5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install the exact checksum-verified official Lean release
        run: bash scripts/install_ci_lean.sh
      - name: Restore pinned Mathlib cache
        run: lake exe cache get
      - name: Verify the selected proof closure, serially
        run: python3 scripts/ci_verify.py --profile n5 --build
      - name: Preserve source hashes, command logs and enforced axiom audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n5-verification-${{ github.sha }}
          path: .lake/ci/n5.json
          if-no-files-found: error
