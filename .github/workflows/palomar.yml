name: Palomar n4 mechanical preflight (no submission)

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact public 40-character commit to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@3561d237dcc4b28482558ad28a64d767d7cc8615
    with:
      repository: GregoryMorse/unrestricted-boolean-mul
      commit: ${{ inputs.commit }}
      pipeline_commit: 3561d237dcc4b28482558ad28a64d767d7cc8615
      # The reusable workflow describes a general identifier, but its pinned
      # submission parser requires exactly twelve lowercase alphanumeric bytes.
      # Runs are isolated by GitHub run ID/attempt in the upstream concurrency key.
      request_id: n4palomar001
      mode: full
      # The workflow consumes the human-readable relationship; the HTTP intake
      # API instead uses the short enum "maintainer". Do not interchange them.
      options: '{"comparator_config_path":"comparator.json","formalization_metadata_path":"formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
