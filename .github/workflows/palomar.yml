name: Palomar n4 preflight (full verification through registry)

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact public 40-character commit to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  source:
    uses: ./.github/workflows/palomar-source.yml
    with:
      commit: ${{ inputs.commit }}
  verify:
    # The official full verifier requires a provisioned Namespace runner.
    # Without it, perform the preliminary check here and request full
    # verification through Palomar, never queue an unserviceable runner job.
    if: vars.PALOMAR_NAMESPACE_ENABLED == 'true'
    needs: source
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: GregoryMorse/unrestricted-boolean-mul
      commit: ${{ inputs.commit }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      # The reusable workflow describes a general identifier, but its pinned
      # submission parser requires exactly twelve lowercase alphanumeric bytes.
      # Runs are isolated by GitHub run ID/attempt in the upstream concurrency key.
      request_id: n4palomar001
      mode: full
      # The workflow consumes the human-readable relationship; the HTTP intake
      # API instead uses the short enum "maintainer". Do not interchange them.
      options: '{"comparator_config_path":"comparator.json","formalization_metadata_path":"formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
