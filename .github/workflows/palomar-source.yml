name: Palomar current source preliminary checks

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact public 40-character source commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
          path: pipeline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.10'
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '3.3.12'
          bundler-cache: true
          working-directory: pipeline
      - name: Install pinned official verifier dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r pipeline/requirements.txt
      - name: Run the official source preparation without a Lean build
        env:
          SOURCE_COMMIT: ${{ inputs.commit }}
          BUNDLE_GEMFILE: ${{ github.workspace }}/pipeline/Gemfile
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          commit = os.environ['SOURCE_COMMIT']
          if not re.fullmatch('[0-9a-f]{40}', commit):
              raise SystemExit('An exact lowercase public source SHA is required')
          options = {
              'comparator_config_path': 'comparator.json',
              'formalization_metadata_path': 'formalization.yaml',
              'authorization_relationship': 'I am a responsible author or maintainer',
          }
          inputs = {
              'repository': 'GregoryMorse/unrestricted-boolean-mul',
              'commit': commit, 'request_id': 'n4palomar001', 'mode': 'full',
              'pipeline_commit': 'd4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44',
              'options': json.dumps(options),
          }
          pathlib.Path(os.environ['RUNNER_TEMP'], 'source-inputs.json').write_text(
              json.dumps({'inputs': inputs}))
          PY
          python pipeline/scripts/verify_submission.py prepare \
            --event "$RUNNER_TEMP/source-inputs.json" \
            --work-dir "$RUNNER_TEMP/palomar-source" \
            --output "$RUNNER_TEMP/source-report.json" \
            --licensee "$(command -v bundle)"
      - name: Preserve the official preliminary report (not a proof verification)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: palomar-source-${{ inputs.commit }}
          path: ${{ runner.temp }}/source-report.json
          if-no-files-found: error
